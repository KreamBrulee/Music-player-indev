name: CI

on:
  push:
    branches: [main, Nova_dev]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake cppcheck
      - name: Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra"
          cmake --build build -j"$(nproc)"
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: API smoke test
        run: tests/smoke.sh
      - name: SAST (cppcheck)
        run: cppcheck --enable=warning,performance,portability --error-exitcode=1 --inline-suppr -q src/
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t music-player:${{ github.sha }} .
      - name: Scan image (trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: music-player:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test container
        run: tests/smoke.sh music-player:${{ github.sha }}
      - name: Maven API tests
        run: |
          mkdir -p /tmp/mp-songs && head -c 4096 /dev/urandom > /tmp/mp-songs/Maven_Test.mp3
          chmod -R a+rX /tmp/mp-songs
          CID=$(docker run -d -p 3998:3000 -v /tmp/mp-songs:/app/songs:ro music-player:${{ github.sha }})
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3998/healthz && break; sleep 0.5; done
          mvn -B -f api-tests/pom.xml test -Dapi.baseUrl=http://127.0.0.1:3998
          docker rm -f "$CID"
