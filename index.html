<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA // ARCADE MUSIC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{
    --bg:#1a0b2e; --bg2:#2d1b4e; --bg3:#100720;
    --pink:#ff3ec9; --cyan:#00ffff; --yellow:#ffd93d;
    --green:#39ff14; --purple:#9b5de5; --orange:#ff7b00; --red:#ff3860;
    --scan:rgba(0,0,0,0.2);
}
*{margin:0;padding:0;box-sizing:border-box;image-rendering:pixelated;}
html,body{min-height:100%;}
body{
    font-family:'VT323',monospace;background:var(--bg);color:#fff;
    min-height:100vh;position:relative;overflow-x:hidden;letter-spacing:1px;font-size:18px;
}
.hidden{display:none;}

/* Shared background */
.stars{position:fixed;inset:0 0 45% 0;z-index:0;overflow:hidden;pointer-events:none;}
.star{position:absolute;width:3px;height:3px;background:#fff;box-shadow:0 0 4px #fff;animation:twinkle 2.5s infinite;}
@keyframes twinkle{0%,100%{opacity:.2;}50%{opacity:1;}}

.bg-grid{position:fixed;left:0;right:0;bottom:0;height:45%;z-index:0;perspective:400px;overflow:hidden;pointer-events:none;opacity:.4;}
.bg-grid::before{
    content:'';position:absolute;inset:-50% -25% -5% -25%;
    background:
        repeating-linear-gradient(90deg,transparent 0 39px,var(--pink) 39px 40px),
        repeating-linear-gradient(0deg,transparent 0 39px,var(--pink) 39px 40px);
    transform:rotateX(60deg);transform-origin:50% 0;
    animation:gridMove 1.6s linear infinite;
}
@keyframes gridMove{from{background-position-y:0,0;}to{background-position-y:40px,40px;}}

/* CRT */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:200;background:repeating-linear-gradient(0deg,transparent 0 2px,var(--scan) 2px 4px);}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:199;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.55) 100%);}

/* =================== APP =================== */
#view-app{padding:24px 32px 140px;position:relative;z-index:1;}
.app{width:100%;margin:0;}

header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;padding:18px 22px;margin-bottom:22px;background:var(--bg2);border:4px solid var(--cyan);box-shadow:0 0 0 4px var(--bg3),0 0 0 8px var(--pink),8px 8px 0 #000;position:relative;}
header::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,0.02) 0 2px,transparent 2px 4px);pointer-events:none;}
.brand{display:flex;align-items:center;gap:14px;}
.logo{width:52px;height:52px;position:relative;
    background:
        linear-gradient(var(--yellow),var(--yellow)) 16px 0 /20px 8px no-repeat,
        linear-gradient(var(--yellow),var(--yellow)) 8px 8px /36px 8px no-repeat,
        linear-gradient(var(--yellow),var(--yellow)) 0 16px /52px 20px no-repeat,
        linear-gradient(#000,#000) 12px 24px /6px 6px no-repeat,
        linear-gradient(#000,#000) 34px 24px /6px 6px no-repeat,
        linear-gradient(var(--yellow),var(--yellow)) 8px 36px /36px 8px no-repeat,
        linear-gradient(var(--yellow),var(--yellow)) 16px 44px /20px 8px no-repeat;
    animation:logoBobble 1.2s ease-in-out infinite;filter:drop-shadow(0 0 4px var(--yellow));}
@keyframes logoBobble{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
h1.title{font-family:'Press Start 2P',monospace;font-size:22px;letter-spacing:3px;background:linear-gradient(180deg,var(--yellow),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:2px 2px 0 rgba(0,0,0,.4);animation:flicker 3s infinite;}
@keyframes flicker{0%,100%{opacity:1;}50%{opacity:.95;}51%{opacity:.7;}52%{opacity:1;}}
.sub{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--cyan);margin-top:6px;letter-spacing:2px;}

.search-wrap{flex:1;min-width:220px;max-width:420px;position:relative;}
.search-wrap input{width:100%;padding:10px 14px 10px 38px;background:#000;border:3px solid var(--cyan);outline:0;color:var(--green);font-family:'VT323',monospace;font-size:20px;letter-spacing:2px;}
.search-wrap input:focus{border-color:var(--pink);box-shadow:0 0 14px var(--pink);}
.search-wrap input::placeholder{color:#486;}
.search-wrap::before{content:'>';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--green);font-family:'Press Start 2P',monospace;font-size:10px;animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:0;}}

.now-playing{display:grid;grid-template-columns:240px 1fr;gap:24px;padding:22px;margin-bottom:24px;background:var(--bg2);border:4px solid var(--pink);box-shadow:0 0 0 4px var(--bg3),0 0 0 8px var(--cyan),8px 8px 0 #000;position:relative;}
.cover{width:240px;height:240px;position:relative;background:#000;border:4px solid var(--cyan);box-shadow:inset 0 0 0 2px #000,inset 0 0 0 6px var(--yellow);overflow:hidden;}
.cover::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.3) 2px 4px);}
body.playing .cover{animation:coverPulse 0.6s steps(2) infinite;}
@keyframes coverPulse{50%{box-shadow:inset 0 0 0 2px #000,inset 0 0 0 6px var(--pink),0 0 20px var(--pink);}}

.mono{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;color:#000;}
.cover .mono{font-size:72px;}
.c-cover .mono{font-size:28px;}
.thumb .mono{font-size:12px;}

.np-info{display:flex;flex-direction:column;gap:12px;min-width:0;}
.np-status{font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:3px;color:var(--green);}
.np-status.paused{color:var(--yellow);}
.np-status .dot{display:inline-block;width:8px;height:8px;background:currentColor;margin-right:8px;animation:blink 1s steps(2) infinite;}
.np-title{font-family:'Press Start 2P',monospace;font-size:18px;letter-spacing:2px;color:var(--yellow);white-space:nowrap;overflow:hidden;}
.np-title .scroll{display:inline-block;padding-right:60px;}
.np-title.overflowing .scroll{animation:marquee 12s linear infinite;}
@keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-100%);}}
.np-artist{font-size:20px;color:var(--cyan);letter-spacing:2px;}

.viz{display:flex;align-items:flex-end;gap:3px;height:42px;margin-top:2px;}
.viz .bar{flex:1;background:var(--green);height:10%;transition:height .1s steps(3);box-shadow:0 0 4px var(--green);}
.viz .bar:nth-child(3n){background:var(--pink);box-shadow:0 0 4px var(--pink);}
.viz .bar:nth-child(5n){background:var(--cyan);box-shadow:0 0 4px var(--cyan);}
.viz .bar:nth-child(7n){background:var(--yellow);box-shadow:0 0 4px var(--yellow);}

.progress-wrap{display:flex;flex-direction:column;gap:6px;}
.time-row{display:flex;justify-content:space-between;color:var(--cyan);font-size:18px;font-variant-numeric:tabular-nums;}
.progress{position:relative;height:14px;background:#000;border:3px solid var(--cyan);cursor:pointer;}
.progress-bar{position:absolute;top:0;left:0;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--pink) 0 6px,var(--yellow) 6px 12px);box-shadow:0 0 8px var(--pink);}

.controls-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:6px;}
.ctrl-group{display:flex;align-items:center;gap:10px;}
.btn{background:var(--bg3);color:#fff;border:3px solid var(--cyan);width:44px;height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 #000;font-family:'Press Start 2P',monospace;font-size:14px;transition:transform .08s steps(2),box-shadow .08s steps(2),background .1s;}
.btn:hover{background:var(--cyan);color:#000;}
.btn.active{background:var(--yellow);color:#000;border-color:#000;}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 #000;}
.btn svg{width:18px;height:18px;}
.btn-play{width:58px;height:58px;background:var(--pink);border-color:#000;box-shadow:4px 4px 0 var(--cyan);}
.btn-play:hover{background:var(--yellow);}
.btn-play svg{width:24px;height:24px;}

.volume{display:flex;align-items:center;gap:8px;}
.volume input[type=range]{-webkit-appearance:none;appearance:none;width:100px;height:12px;background:#000;border:2px solid var(--cyan);outline:0;}
.volume input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:16px;background:var(--pink);cursor:pointer;border:2px solid #000;}
.volume input[type=range]::-moz-range-thumb{width:12px;height:16px;background:var(--pink);cursor:pointer;border:2px solid #000;}

.panel{background:var(--bg2);border:4px solid var(--cyan);padding:16px;box-shadow:4px 4px 0 #000;position:relative;min-width:0;margin-bottom:28px;}
.panel h2{font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:3px;color:var(--yellow);margin-bottom:12px;padding-bottom:10px;border-bottom:2px dashed var(--pink);}
.queue-panel .list-row{display:flex;flex-direction:row;gap:10px;overflow-x:auto;overflow-y:hidden;max-height:none;padding-bottom:6px;}
.queue-panel .list-row .song{flex:0 0 220px;}
.queue-panel .list-row.empty-row{display:block;}
.list::-webkit-scrollbar{height:10px;width:10px;}
.list::-webkit-scrollbar-track{background:#000;}
.list::-webkit-scrollbar-thumb{background:var(--pink);border:2px solid #000;}
.empty{padding:16px 10px;text-align:center;color:#aaa;font-size:16px;border:2px dashed var(--cyan);}

.song{display:flex;align-items:center;gap:10px;padding:8px;background:var(--bg3);border:2px solid transparent;cursor:pointer;transition:background .08s,border-color .08s,transform .08s steps(2);}
.song:hover{border-color:var(--cyan);background:#000;transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--pink);}
.thumb{width:36px;height:36px;flex-shrink:0;border:2px solid #000;overflow:hidden;background:#000;}
.song .meta{flex:1;min-width:0;}
.song .t{font-size:18px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:1px;}
.song .a{font-size:14px;color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Press Start 2P',monospace;}
.icon-btn{width:28px;height:28px;background:#000;border:2px solid var(--cyan);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;font-size:14px;flex-shrink:0;}
.icon-btn:hover{background:var(--cyan);color:#000;}

.song-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
.card{background:var(--bg2);border:4px solid var(--cyan);padding:14px;box-shadow:4px 4px 0 #000;position:relative;cursor:pointer;transition:transform .08s steps(2),box-shadow .08s steps(2);}
.card:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 var(--pink);border-color:var(--yellow);}
.card.current{border-color:var(--pink);box-shadow:4px 4px 0 var(--yellow);}
.c-cover{width:100%;aspect-ratio:1;margin-bottom:12px;border:3px solid #000;background:#000;overflow:hidden;}
.c-title{font-size:20px;color:var(--yellow);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.c-artist{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--cyan);margin-bottom:12px;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c-actions{display:flex;gap:8px;align-items:center;}
.c-play{flex:1;padding:8px;border:3px solid #000;background:var(--pink);color:#000;cursor:pointer;font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:2px;box-shadow:3px 3px 0 var(--cyan);transition:transform .08s steps(2),box-shadow .08s steps(2),background .1s;}
.c-play:hover{background:var(--yellow);}
.c-play:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--cyan);}

.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 16px;flex-wrap:wrap;gap:8px;}
.section-head h2{font-family:'Press Start 2P',monospace;font-size:14px;letter-spacing:3px;color:var(--yellow);}
.section-head .count{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--cyan);letter-spacing:2px;}
.kbd{display:inline-block;padding:2px 6px;background:#000;border:2px solid var(--cyan);font-family:'Press Start 2P',monospace;font-size:8px;color:var(--yellow);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--bg2);border:3px solid var(--yellow);color:var(--yellow);font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:2px;padding:12px 20px;z-index:300;box-shadow:4px 4px 0 #000;transition:transform .2s steps(4);pointer-events:none;max-width:80vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}

@media (max-width: 900px){
    .now-playing{grid-template-columns:1fr;}
    .cover{width:100%;max-width:320px;height:auto;aspect-ratio:1;margin:0 auto;}
}
</style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="bg-grid"></div>

    <div class="app" id="view-app">
        <header>
            <div class="brand">
                <div class="logo"></div>
                <div>
                    <h1 class="title">★ NOVA ★</h1>
                    <div class="sub">ARCADE MUSIC // LOCAL LIBRARY</div>
                </div>
            </div>
            <div class="search-wrap">
                <input id="search" type="text" placeholder="FILTER LIBRARY... (/)" />
            </div>
        </header>

        <div class="now-playing">
            <div class="cover" id="cover"></div>
            <div class="np-info">
                <div class="np-status" id="np-status"><span class="dot"></span><span id="np-status-text">STANDBY</span></div>
                <div class="np-title" id="np-title-wrap"><span class="scroll" id="np-title-text">NO TRACK LOADED</span></div>
                <div class="np-artist" id="now-artist">&gt; PICK A TRACK &lt;</div>
                <div class="viz" id="visualizer"></div>
                <div class="progress-wrap">
                    <div class="progress" id="progress-track">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                    <div class="time-row">
                        <span id="time-current">0:00</span>
                        <span id="time-total">0:00</span>
                    </div>
                </div>
                <div class="controls-row">
                    <div class="ctrl-group">
                        <button class="btn" id="btn-shuffle" onclick="toggleShuffle()" title="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg></button>
                        <button class="btn" onclick="previousSong()" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM9.5 12l10-7v14z"/></svg></button>
                    </div>
                    <div class="ctrl-group">
                        <button class="btn btn-play" id="play-pause" onclick="togglePlay()" title="Play/Pause"><svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
                    </div>
                    <div class="ctrl-group">
                        <button class="btn" onclick="nextSong()" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM14.5 12l-10 7V5z"/></svg></button>
                        <button class="btn" id="btn-repeat" onclick="toggleRepeat()" title="Repeat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></button>
                    </div>
                    <div class="volume">
                        <button class="btn" id="btn-mute" onclick="toggleMute()" title="Mute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
                        <input type="range" id="vol" min="0" max="100" value="60" />
                    </div>
                </div>
            </div>
        </div>

        <div class="panel queue-panel">
            <h2>▶ UP NEXT</h2>
            <div id="panel-queue" class="list list-row"><div class="empty">QUEUE IS EMPTY</div></div>
        </div>

        <section>
            <div class="section-head">
                <h2>&gt;&gt; ALL SONGS &lt;&lt;</h2>
                <div class="count"><span id="song-count">0</span> TRACKS &middot; <span class="kbd">SPACE</span> PLAY/PAUSE &middot; <span class="kbd">/</span> FIND</div>
            </div>
            <div id="song-list" class="song-grid"><div class="empty" style="grid-column:1/-1">LOADING...</div></div>
        </section>
    </div>

    <div class="toast" id="toast"></div>
    <audio id="audio-player" class="hidden" preload="auto"></audio>

<script>
const $ = id => document.getElementById(id);
const esc = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { if (!isFinite(s) || s < 0) return '0:00'; s = Math.floor(s); const m = Math.floor(s/60), ss = s%60; return `${m}:${String(ss).padStart(2,'0')}`; };
const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2200); };

// ============ SFX (decorative arcade blips) ============
let sfxCtx;
function sfx(freq=440, dur=0.05, type='square'){
    try {
        sfxCtx = sfxCtx || new (window.AudioContext||window.webkitAudioContext)();
        const o = sfxCtx.createOscillator(), g = sfxCtx.createGain();
        o.type = type; o.frequency.value = freq; g.gain.value = 0.04;
        o.connect(g); g.connect(sfxCtx.destination);
        o.start(); o.stop(sfxCtx.currentTime + dur);
    } catch(e) {}
}

// ============ Stars ============
function initStars(){
    const host = $('stars');
    for (let i=0;i<60;i++){
        const d = document.createElement('div');
        d.className = 'star';
        d.style.left = Math.random()*100+'%';
        d.style.top = Math.random()*100+'%';
        d.style.animationDelay = (Math.random()*2)+'s';
        host.appendChild(d);
    }
}

// ============ Monogram cover art (local files have no album art) ============
const PALETTE = ['var(--pink)','var(--cyan)','var(--yellow)','var(--green)','var(--purple)','var(--orange)'];
function colorFor(id){
    let h = 0;
    for (const ch of String(id)) h = (h*31 + ch.charCodeAt(0)) >>> 0;
    return PALETTE[h % PALETTE.length];
}
function monogramLetter(title){
    const t = (title||'').trim();
    return t ? t[0].toUpperCase() : '?';
}
function monogramHTML(song){
    return `<div class="mono" style="background:${colorFor(song.id)}">${esc(monogramLetter(song.title))}</div>`;
}

// ============ Playback state ============
const audioPlayer = $('audio-player');
let songs = [];
let queue = [];
let history = [];
let currentSong = null;
let shuffleOn = false;
let repeatMode = 0; // 0 off, 1 repeat all, 2 repeat one
let searchQuery = '';
let currentVolume = 0.6;
let lastVolume = 0.6;
audioPlayer.volume = currentVolume;

function findSong(id){ return songs.find(s => s.id === id); }
function pushHistory(song){
    if (!song) return;
    history.unshift(song);
    if (history.length > 10) history.pop();
}
function shuffleArray(arr){
    for (let i = arr.length-1; i > 0; i--){
        const j = Math.floor(Math.random()*(i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function setStatusText(text, cls){
    $('np-status-text').textContent = text;
    $('np-status').classList.toggle('paused', cls === 'paused');
}

function startPlayback(song){
    currentSong = song;
    renderNowPlaying();
    renderGrid();
    renderQueue();

    ensureAudioGraph();
    audioPlayer.pause();
    audioPlayer.currentTime = 0;
    audioPlayer.src = `/api/songs/${encodeURIComponent(song.id)}/play`;
    audioPlayer.load();
    const p = audioPlayer.play();
    if (p) p.catch(err => { console.error('Play error:', err); setStatusText('CLICK PLAY TO START'); });
    sfx(700, 0.05);
}

function playSong(song){
    if (!song) return;
    pushHistory(currentSong);
    const qi = queue.findIndex(s => s.id === song.id);
    if (qi !== -1) queue.splice(qi, 1);
    startPlayback(song);
}

function togglePlay(){
    if (!currentSong) { if (songs.length) playSong(songs[0]); return; }
    if (audioPlayer.paused) { ensureAudioGraph(); audioPlayer.play(); }
    else audioPlayer.pause();
    sfx(600, 0.04);
}

function nextSong(){
    if (repeatMode === 2 && currentSong) { audioPlayer.currentTime = 0; audioPlayer.play(); return; }
    let next = null;
    if (queue.length) {
        const idx = shuffleOn ? Math.floor(Math.random()*queue.length) : 0;
        next = queue.splice(idx, 1)[0];
    } else if (repeatMode === 1 && songs.length) {
        queue = songs.filter(s => !currentSong || s.id !== currentSong.id).slice();
        if (shuffleOn) shuffleArray(queue);
        next = queue.shift();
    }
    if (!next) { setStatusText('QUEUE EMPTY'); return; }
    pushHistory(currentSong);
    startPlayback(next);
}

function previousSong(){
    if (!history.length) return;
    const prev = history.shift();
    if (currentSong) queue.unshift(currentSong);
    startPlayback(prev);
}

function addToQueue(song){
    if (!song) return;
    queue.push(song);
    renderQueue();
    toast('ADDED TO QUEUE: ' + song.title.toUpperCase());
    sfx(900, 0.06);
}

function toggleShuffle(){
    shuffleOn = !shuffleOn;
    $('btn-shuffle').classList.toggle('active', shuffleOn);
    toast(shuffleOn ? 'SHUFFLE ON' : 'SHUFFLE OFF');
    sfx(shuffleOn ? 900 : 500, 0.05);
}
function toggleRepeat(){
    repeatMode = (repeatMode+1) % 3;
    $('btn-repeat').classList.toggle('active', repeatMode > 0);
    toast(['REPEAT OFF','REPEAT ALL','REPEAT ONE'][repeatMode]);
    sfx(700, 0.05);
}
function setVolume(v, syncSlider){
    currentVolume = Math.max(0, Math.min(1, v));
    // Once the element is routed through the Web Audio graph (see
    // ensureAudioGraph), its native .volume no longer affects output —
    // the gain node is the only thing that does, so drive that instead.
    if (gainNode) gainNode.gain.value = currentVolume;
    else audioPlayer.volume = currentVolume;
    if (syncSlider) $('vol').value = Math.round(currentVolume*100);
}
function toggleMute(){
    if (currentVolume > 0) {
        lastVolume = currentVolume;
        setVolume(0, true);
        $('btn-mute').classList.add('active');
    } else {
        setVolume(lastVolume || 0.6, true);
        $('btn-mute').classList.remove('active');
    }
}
$('vol').addEventListener('input', e => setVolume(e.target.value/100));

function updatePlayPauseIcon(){
    $('icon-play').innerHTML = audioPlayer.paused
        ? '<path d="M8 5v14l11-7z"/>'
        : '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
}

// ============ Now playing / progress ============
function renderNowPlaying(){
    if (currentSong) {
        $('cover').innerHTML = monogramHTML(currentSong);
        $('np-title-text').textContent = currentSong.title.toUpperCase();
        $('now-artist').textContent = '> ' + currentSong.artist.toUpperCase();
    } else {
        $('cover').innerHTML = '';
        $('np-title-text').textContent = 'NO TRACK LOADED';
        $('now-artist').textContent = '> PICK A TRACK <';
    }
    setTimeout(() => {
        const wrap = $('np-title-wrap'), span = $('np-title-text');
        wrap.classList.toggle('overflowing', span.scrollWidth > wrap.clientWidth);
    }, 50);
}

audioPlayer.addEventListener('timeupdate', () => {
    if (audioPlayer.duration && isFinite(audioPlayer.duration)) {
        $('progress-bar').style.width = (audioPlayer.currentTime/audioPlayer.duration*100) + '%';
        $('time-current').textContent = fmt(audioPlayer.currentTime);
    }
});
audioPlayer.addEventListener('loadedmetadata', () => { $('time-total').textContent = fmt(audioPlayer.duration); });
audioPlayer.addEventListener('waiting', () => setStatusText('BUFFERING...'));
audioPlayer.addEventListener('playing', () => { setStatusText('PLAYING'); document.body.classList.add('playing'); updatePlayPauseIcon(); });
audioPlayer.addEventListener('pause', () => { setStatusText('PAUSED', 'paused'); document.body.classList.remove('playing'); updatePlayPauseIcon(); });
audioPlayer.addEventListener('ended', nextSong);
audioPlayer.addEventListener('error', () => { setStatusText('ERROR LOADING AUDIO'); toast('PLAYBACK ERROR'); });

// Click/drag to seek
(function(){
    const track = $('progress-track');
    let dragging = false;
    function seek(e){
        if (!audioPlayer.duration || !isFinite(audioPlayer.duration)) return;
        const r = track.getBoundingClientRect();
        const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
        audioPlayer.currentTime = (x / r.width) * audioPlayer.duration;
    }
    track.addEventListener('mousedown', e => { dragging = true; seek(e); });
    addEventListener('mousemove', e => { if (dragging) seek(e); });
    addEventListener('mouseup', () => dragging = false);
})();

// ============ Live audio visualizer + volume graph ============
// Routing audioPlayer through the Web Audio API (needed for the visualizer)
// means its native .volume stops doing anything — gainNode is the real
// volume control from this point on (see setVolume above).
let audioCtx, analyser, gainNode, freqData, vizBars = [];
function ensureAudioGraph(){
    if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
    try {
        audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        const source = audioCtx.createMediaElementSource(audioPlayer);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.6;
        gainNode = audioCtx.createGain();
        gainNode.gain.value = currentVolume;
        source.connect(analyser);
        analyser.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        freqData = new Uint8Array(analyser.frequencyBinCount);
        audioCtx.resume();
    } catch(e) { console.warn('Visualizer/volume graph unavailable, falling back to native volume:', e); }
}
// Set up the graph on the very first user interaction, so it's already
// running (not racing audioPlayer.src/.load() changes) by the time a song
// is actually played.
addEventListener('pointerdown', ensureAudioGraph, { once: true });
addEventListener('keydown', ensureAudioGraph, { once: true });

function initVisualizerBars(){
    const host = $('visualizer');
    host.innerHTML = '';
    for (let i=0;i<24;i++){ const b = document.createElement('div'); b.className = 'bar'; host.appendChild(b); vizBars.push(b); }
}
function tickVisualizer(){
    requestAnimationFrame(tickVisualizer);
    if (!analyser || audioPlayer.paused || audioCtx.state !== 'running') { vizBars.forEach(b => b.style.height = '10%'); return; }
    analyser.getByteFrequencyData(freqData);
    const step = Math.max(1, Math.floor(freqData.length / vizBars.length));
    vizBars.forEach((b,i) => { b.style.height = Math.max(10, (freqData[i*step]||0)/255*100) + '%'; });
}

// ============ Library ============
function cardHTML(song){
    const isCurrent = currentSong && currentSong.id === song.id;
    return `
      <div class="card ${isCurrent?'current':''}" data-id="${esc(song.id)}">
        <div class="c-cover">${monogramHTML(song)}</div>
        <div class="c-title">${esc(song.title.toUpperCase())}</div>
        <div class="c-artist">${esc(song.artist.toUpperCase())}</div>
        <div class="c-actions">
          <button class="c-play" data-action="play" data-id="${esc(song.id)}">&#9654; PLAY</button>
          <button class="icon-btn" data-action="queue" data-id="${esc(song.id)}" title="Add to queue">+</button>
        </div>
      </div>`;
}
function renderGrid(){
    const q = searchQuery.trim().toLowerCase();
    const filtered = q ? songs.filter(s => s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)) : songs;
    $('song-count').textContent = filtered.length;
    if (!filtered.length) {
        $('song-list').innerHTML = `<div class="empty" style="grid-column:1/-1">${songs.length ? 'NO MATCHES' : 'NO SONGS FOUND'}</div>`;
        return;
    }
    $('song-list').innerHTML = filtered.map(cardHTML).join('');
    $('song-list').querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => playSong(findSong(card.dataset.id)));
    });
    $('song-list').querySelectorAll('[data-action="play"]').forEach(btn => {
        btn.addEventListener('click', e => { e.stopPropagation(); playSong(findSong(btn.dataset.id)); });
    });
    $('song-list').querySelectorAll('[data-action="queue"]').forEach(btn => {
        btn.addEventListener('click', e => { e.stopPropagation(); addToQueue(findSong(btn.dataset.id)); });
    });
}

function rowHTML(song){
    return `
      <div class="song" data-id="${esc(song.id)}">
        <div class="thumb">${monogramHTML(song)}</div>
        <div class="meta"><div class="t">${esc(song.title.toUpperCase())}</div><div class="a">${esc(song.artist.toUpperCase())}</div></div>
      </div>`;
}
function renderQueue(){
    const host = $('panel-queue');
    if (!queue.length) { host.innerHTML = '<div class="empty">QUEUE IS EMPTY</div>'; return; }
    host.innerHTML = queue.map(rowHTML).join('');
    host.querySelectorAll('.song').forEach(row => {
        row.addEventListener('click', () => playSong(findSong(row.dataset.id)));
    });
}

async function loadSongs(){
    $('song-list').innerHTML = '<div class="empty" style="grid-column:1/-1">LOADING...</div>';
    try {
        const res = await fetch('/api/songs');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        songs = data.songs || [];
        renderGrid();
    } catch(e) {
        console.error('Failed to load songs:', e);
        $('song-list').innerHTML = '<div class="empty" style="grid-column:1/-1">FAILED TO LOAD SONGS</div>';
    }
}

$('search').addEventListener('input', e => { searchQuery = e.target.value; renderGrid(); });

// ============ Keyboard shortcuts ============
addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') e.target.blur(); return; }
    switch (e.key) {
        case ' ': e.preventDefault(); togglePlay(); break;
        case 'ArrowRight': nextSong(); break;
        case 'ArrowLeft': previousSong(); break;
        case 'ArrowUp': e.preventDefault(); setVolume(currentVolume+0.05, true); break;
        case 'ArrowDown': e.preventDefault(); setVolume(currentVolume-0.05, true); break;
        case 's': case 'S': toggleShuffle(); break;
        case 'r': case 'R': toggleRepeat(); break;
        case 'm': case 'M': toggleMute(); break;
        case '/': e.preventDefault(); $('search').focus(); break;
    }
});

// ============ Boot ============
initStars();
initVisualizerBars();
requestAnimationFrame(tickVisualizer);
updatePlayPauseIcon();
loadSongs();
</script>
</body>
</html>
