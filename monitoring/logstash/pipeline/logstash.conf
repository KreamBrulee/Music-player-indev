input {
  beats { port => 5044 }
}

filter {
  # Only the app's structured lines carry a "service" field.
  if [service] != "music-player" { drop {} }

  if [ts_ms] {
    date { match => ["ts_ms", "UNIX_MS"] target => "@timestamp" }
  }
  mutate {
    convert => { "status" => "integer" "duration_ms" => "float" "bytes" => "integer" }
    remove_field => ["message", "agent", "ecs", "log", "input", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "music-player-%{+YYYY.MM.dd}"
  }
}
