# GitLab CI equivalent of the Jenkinsfile (same stages, same scripts).
stages: [build, test, security, package, deploy]

default:
  image: gcc:13

variables:
  GIT_DEPTH: "0"          # gitleaks scans history
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

build:
  stage: build
  before_script: [apt-get update -qq, apt-get install -y -qq cmake]
  script:
    - cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra"
    - cmake --build build -j"$(nproc)"
  artifacts: { paths: [build/music_player, build/unit_tests], expire_in: 1 day }

unit-tests:
  stage: test
  needs: [build]
  before_script: [apt-get update -qq, apt-get install -y -qq cmake]
  script: [ctest --test-dir build --output-on-failure]

api-smoke-test:
  stage: test
  needs: [build]
  before_script: [apt-get update -qq, apt-get install -y -qq curl]
  script: [tests/smoke.sh]

sast-cppcheck:
  stage: security
  before_script: [apt-get update -qq, apt-get install -y -qq cppcheck]
  script: [cppcheck --enable=warning,performance,portability --error-exitcode=1 --inline-suppr -q src/]

secret-scan:
  stage: security
  image: { name: zricethezav/gitleaks:latest, entrypoint: [""] }
  script: [gitleaks detect --source . --redact --no-banner]

docker-build-scan:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  variables: { DOCKER_TLS_CERTDIR: "" }
  before_script:
    - apk add --no-cache curl bash
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE" .
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress "$IMAGE"
    - tests/smoke.sh "$IMAGE"
    - docker push "$IMAGE"
  rules: [{ if: '$CI_COMMIT_BRANCH' }]

deploy-k8s:
  stage: deploy
  image: bitnami/kubectl:latest
  needs: [docker-build-scan]
  script: [k8s/deploy.sh "$IMAGE"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
