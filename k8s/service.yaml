apiVersion: v1
kind: Service
metadata:
  name: music-player
  namespace: music-player
  labels: { app: music-player }
spec:
  type: ClusterIP   # use `kubectl port-forward svc/music-player 3000:80` or an Ingress
  selector: { app: music-player }
  ports:
    - { name: http, port: 80, targetPort: http }
