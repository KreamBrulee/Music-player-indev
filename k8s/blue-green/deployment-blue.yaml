apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-player-blue
  namespace: music-player
  labels: { app: music-player-bg, version: blue }
spec:
  replicas: 2
  selector:
    matchLabels: { app: music-player-bg, version: blue }
  template:
    metadata:
      labels: { app: music-player-bg, version: blue }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
      containers:
        - name: music-player
          # blue = current release, green = candidate. Change the tag on the
          # idle colour, test it, then run ./switch.sh <colour>.
          image: music-player:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          volumeMounts:
            - { name: config, mountPath: /app/config.json, subPath: config.json, readOnly: true }
            - { name: songs, mountPath: /app/songs, readOnly: true }
      volumes:
        - name: config
          configMap: { name: music-player-config }
        - name: songs
          persistentVolumeClaim: { claimName: music-library }
