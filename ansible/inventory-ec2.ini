# The EC2 instance from terraform/aws (Elastic IP, Ubuntu 24.04).
# Key auth with the same ~/.ssh/id_ed25519 that Terraform installed, so no
# --ask-pass. accept-new trusts the host key on first connect but still
# refuses a changed key later.

[ec2_host]
music-player-ec2 ansible_host=13.51.230.209 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519 ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
