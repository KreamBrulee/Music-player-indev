# The app instance from terraform/aws (Elastic IP, Ubuntu 24.04).
# Key auth via ssh-agent: run `ssh-add ~/.ssh/id_ed25519` once on the Mac,
# or let Jenkins provide the key through its SSH-agent credential. No key
# path is hardcoded here so the one inventory works in both places.
# accept-new trusts the host key on first connect, refuses a changed one.

[ec2_host]
music-player-ec2 ansible_host=13.51.230.209 ansible_user=ubuntu ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
