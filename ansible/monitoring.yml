---
# Deploys the monitoring stack:
#   - app hosts get node_exporter + cadvisor (metrics producers)
#   - the monitoring host (Jenkins box) gets Prometheus + Grafana
#
#   ansible-playbook -i inventory-ec2.ini -i inventory-jenkins.ini monitoring.yml
#
# Prometheus scrapes every host in the ec2_host group — their private IPs are
# read from facts automatically (see app_scrape_targets below), so adding more
# app instances to the inventory extends monitoring with no edits here.

- name: Exporters on app hosts
  hosts: ec2_host
  become: true

  vars:
    monitoring_dir: /opt/monitoring

  tasks:
    - name: Create the monitoring dir
      ansible.builtin.file:
        path: "{{ monitoring_dir }}"
        state: directory
        mode: "0755"

    - name: Copy the exporters compose file
      ansible.builtin.copy:
        src: ../monitoring/exporters-compose.yml
        dest: "{{ monitoring_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Start the exporters
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ monitoring_dir }}"

- name: Prometheus and Grafana on the monitoring host
  hosts: jenkins_host
  become: true

  vars:
    monitoring_dir: /opt/monitoring
    grafana_admin_password: admin
    # Derived from the app hosts' own facts (gathered in the first play), so no
    # IP is hardcoded. Each app host's private address is what Prometheus, which
    # runs here inside the VPC, scrapes.
    app_scrape_targets: >-
      {{ groups['ec2_host']
         | map('extract', hostvars, ['ansible_default_ipv4', 'address'])
         | list }}

  tasks:
    - name: Create the monitoring dir tree
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ monitoring_dir }}"
        - "{{ monitoring_dir }}/prometheus"

    - name: Copy the compose file
      ansible.builtin.copy:
        src: ../monitoring/docker-compose.yml
        dest: "{{ monitoring_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Copy the Grafana provisioning tree
      ansible.builtin.copy:
        src: ../monitoring/grafana
        dest: "{{ monitoring_dir }}/"
        mode: "0644"
        directory_mode: "0755"

    - name: Render the Prometheus config with the app scrape targets
      ansible.builtin.template:
        src: ../monitoring/prometheus/prometheus.yml.j2
        dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
        mode: "0644"

    - name: Start Prometheus and Grafana
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ monitoring_dir }}"
      environment:
        GRAFANA_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
