# Fill in ansible_host and ansible_user for your Windows hosting machine.
# This uses the SAME SSH access you already have to that machine (the one
# you use to run docker build there) — no WinRM setup needed.
#
# ansible_shell_type=sh (not "powershell"!) is deliberate: this machine's
# SSH DefaultShell is already pwsh.exe (checked HKLM:\SOFTWARE\OpenSSH\
# DefaultShell), so Ansible's own "powershell" shell type would wrap every
# command in ANOTHER powershell.exe invocation on top of that — pwsh then
# fails trying to re-parse Ansible's already-PowerShell-formatted command
# as if it were pwsh's own arguments. "sh" sends commands through as plain
# text with no extra wrapping, which is what a raw-task playbook like this
# one actually needs, whatever the landing shell turns out to be.

[music_host]
music-player-host ansible_host=192.168.0.101 ansible_user=admin ansible_connection=ssh ansible_shell_type=sh ansible_port=22
