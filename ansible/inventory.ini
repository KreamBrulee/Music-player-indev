# Fill in ansible_host and ansible_user for your Windows hosting machine.
# This uses the SAME SSH access you already have to that machine (the one
# you use to run docker build there) — no WinRM setup needed.
#
# ansible_shell_type=powershell tells Ansible the remote shell is PowerShell,
# not bash/cmd, so it formats commands correctly.

[music_host]
music-player-host ansible_host=CHANGE_ME ansible_user=CHANGE_ME ansible_connection=ssh ansible_shell_type=powershell ansible_port=22
